<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PESTEL · Gestión Integrada ISO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#003B49; --teal-light:#0A5568; --orange:#CF4520;
    --cream:#F7F5F0; --ink:#12222A; --line:#DCE3E1; --card-bg:#FFFFFF; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:'Space Grotesk',sans-serif; -webkit-font-smoothing:antialiased;}
  .mono{font-family:'JetBrains Mono',monospace;}
  header{background:var(--teal); color:#fff; padding:20px 24px;}
  .header-inner{max-width:980px; margin:0 auto; display:flex; align-items:center; gap:14px;}
  .back{color:#fff; opacity:.8; text-decoration:none; font-size:13px;}
  .back:hover{opacity:1;}
  h1{margin:0; font-size:18px; font-weight:600;}
  .code-pill{font-family:'JetBrains Mono',monospace; font-size:10.5px; background:rgba(255,255,255,.12); padding:3px 9px; border-radius:999px; margin-left:auto;}
  main{max-width:980px; margin:0 auto; padding:28px 24px 64px;}
  .panel{background:var(--card-bg); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:22px;}
  .panel h2{margin:0 0 4px; font-size:16px; font-weight:600;}
  .panel .sub{margin:0 0 18px; font-size:12.5px; color:#6B7A7E;}
  label{display:block; font-size:12.5px; font-weight:500; color:#3F4E52; margin-bottom:5px; margin-top:14px;}
  label:first-of-type{margin-top:0;}
  input[type=text], textarea, select{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    font-family:'Space Grotesk',sans-serif; font-size:14px; color:var(--ink); background:#FCFCFB;
  }
  textarea{resize:vertical; min-height:52px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--teal-light); outline-offset:1px; border-color:var(--teal-light);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:640px){.row2,.row3{grid-template-columns:1fr;}}
  .actions{display:flex; align-items:center; gap:12px; margin-top:18px;}
  button{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; padding:10px 18px; border-radius:8px; border:none; cursor:pointer;}
  .btn-primary{background:var(--orange); color:#fff;}
  .btn-primary:hover{background:#B93B1A;}
  .btn-secondary{background:transparent; color:var(--teal-light); border:1px solid var(--line);}
  .status{font-size:12.5px; color:#6B7A7E;}
  .status.ok{color:#2C6E45;}
  .status.err{color:#B93B1A;}

  .pestel-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:760px){.pestel-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:480px){.pestel-grid{grid-template-columns:1fr;}}
  .pestel-col{border:1px solid var(--line); border-radius:10px; padding:12px; background:#FCFCFB;}
  .pestel-col h3{margin:0 0 8px; font-size:11.5px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.4px; color:var(--teal-light);}
  .p-item{background:#fff; border:1px solid var(--line); border-radius:7px; padding:8px 9px; margin-bottom:6px; font-size:12.3px; line-height:1.4; cursor:pointer;}
  .p-item .meta{display:block; margin-top:4px; font-size:10px; color:#8A9A9E; font-family:'JetBrains Mono',monospace;}
  .p-empty{font-size:11.5px; color:#9AA8AC;}
  .impacto-pos{color:#2C6E45;} .impacto-neg{color:#B93B1A;} .impacto-ind{color:#8A9A9E;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="back" href="index.html">&larr; Inicio</a>
    <h1>PESTEL</h1>
    <span class="code-pill mono">DOC-SGC-008</span>
  </div>
</header>

<main>

  <div class="panel">
    <h2 id="form-title">Nuevo factor PESTEL</h2>
    <p class="sub">Mismo formato del documento — categoría, factor, plazo e impacto.</p>

    <form id="form-pestel">
      <input type="hidden" id="f-id" value="">

      <div class="row2">
        <div>
          <label for="f-categoria">Categoría PESTEL</label>
          <select id="f-categoria" required>
            <option value="">Selecciona...</option>
            <option value="Político">Político</option>
            <option value="Económico">Económico</option>
            <option value="Social">Social</option>
            <option value="Tecnológico">Tecnológico</option>
            <option value="Ecológico-Ambiental">Ecológico-Ambiental</option>
            <option value="Legal">Legal</option>
          </select>
        </div>
        <div>
          <label for="f-factor">Factor</label>
          <input type="text" id="f-factor" placeholder="Ej: Conflictos bélicos internacionales" required>
        </div>
      </div>

      <label for="f-descripcion">Descripción del factor</label>
      <textarea id="f-descripcion"></textarea>

      <div class="row3">
        <div>
          <label for="f-plazo">Plazo</label>
          <select id="f-plazo">
            <option value="">-</option>
            <option value="Corto">Corto (≤1 año)</option>
            <option value="Mediano">Mediano (1-3 años)</option>
            <option value="Largo">Largo (≥3 años)</option>
          </select>
        </div>
        <div>
          <label for="f-impacto-tipo">Impacto</label>
          <select id="f-impacto-tipo">
            <option value="">-</option>
            <option value="Positivo">Positivo</option>
            <option value="Negativo">Negativo</option>
            <option value="Indiferente">Indiferente</option>
          </select>
        </div>
        <div>
          <label for="f-ambito">Ámbito</label>
          <select id="f-ambito" required>
            <option value="">Selecciona...</option>
            <option value="Terreno">Terreno</option>
            <option value="Oficina">Oficina</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="f-obra">Obra (opcional)</label>
          <input type="text" id="f-obra" placeholder="Solo si es específico de un proyecto">
        </div>
        <div></div>
      </div>

      <div class="row2">
        <div>
          <label for="f-prob">Probabilidad (1-5)</label>
          <select id="f-prob"><option value="">-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
        </div>
        <div>
          <label for="f-consecuencia">Consecuencia (1-5)</label>
          <select id="f-consecuencia"><option value="">-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
        </div>
      </div>

      <label style="display:flex; align-items:center; gap:8px; margin-top:16px;">
        <input type="checkbox" id="f-monitorear" style="width:auto;">
        Monitorear en Panel de Control
      </label>

      <label for="f-responsables">Responsables de ejecución (mínimo 2 personas, separadas por coma)</label>
      <input type="text" id="f-responsables" placeholder="Ej: Carlos Braun, Cristián Menéndez" required>

      <div class="actions">
        <button type="submit" class="btn-primary">Guardar</button>
        <button type="button" class="btn-secondary" id="btn-cancelar" style="display:none;">Cancelar edición</button>
        <span class="status" id="status"></span>
      </div>
    </form>
  </div>

  <div class="panel">
    <h2>Vista PESTEL</h2>
    <p class="sub">Agrupado por categoría, igual que el documento.</p>
    <div class="pestel-grid" id="pestel-grid"></div>
  </div>

</main>

<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzCquDf6sVRaGePNemoq1CMlZN9wdivpRmCw7omiSkgHiIcWIcf8jhC5t9Lc01UhMt7hw/exec';
  const APP_KEY = 'senercom-sgi-7x9K2m';
  const TABLA = 'PESTEL';
  const USUARIO = 'Carlos Braun';
  const CATEGORIAS = ['Político', 'Económico', 'Social', 'Tecnológico', 'Ecológico-Ambiental', 'Legal'];
  let items = [];

  const form = document.getElementById('form-pestel');
  const statusEl = document.getElementById('status');
  const btnCancelar = document.getElementById('btn-cancelar');
  const formTitle = document.getElementById('form-title');

  function setStatus(msg, tipo) { statusEl.textContent = msg; statusEl.className = 'status' + (tipo ? ' ' + tipo : ''); }
  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function formatearFecha(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function listar() {
    const callbackName = 'cb_' + Date.now();
    window[callbackName] = function (data) {
      items = data.registros || [];
      renderGrid();
      delete window[callbackName];
      document.body.removeChild(script);
    };
    const script = document.createElement('script');
    script.src = APP_URL + '?accion=listar&tabla=' + TABLA + '&clave=' + APP_KEY + '&callback=' + callbackName;
    document.body.appendChild(script);
  }

  function renderGrid() {
    const grid = document.getElementById('pestel-grid');
    grid.innerHTML = CATEGORIAS.map(function (cat) {
      const propios = items.filter(function (x) { return x['Categoría PESTEL'] === cat; });
      const lista = propios.length
        ? propios.map(function (r) {
            const impClass = r['Impacto'] === 'Positivo' ? 'impacto-pos' : (r['Impacto'] === 'Negativo' ? 'impacto-neg' : 'impacto-ind');
            const fechaEdicion = r['modificado_fecha'] || r['creado_fecha'] || '';
            return '<div class="p-item" onclick="editar(\'' + r.id + '\')">' +
              '<strong>' + escapeHtml(r['Factor']) + '</strong>' +
              '<span class="meta ' + impClass + '">' + (r['Plazo'] || '') + ' · ' + (r['Impacto'] || '') + '</span>' +
              (r['Responsables de ejecución'] ? '<span class="meta">' + escapeHtml(r['Responsables de ejecución']) + '</span>' : '') +
              (fechaEdicion ? '<span class="meta">Editado: ' + formatearFecha(fechaEdicion) + '</span>' : '') +
              '</div>';
          }).join('')
        : '<div class="p-empty">Sin factores aún.</div>';
      return '<div class="pestel-col"><h3>' + cat + '</h3>' + lista + '</div>';
    }).join('');
    // formatearFecha se define abajo
  }

  window.editar = function (id) {
    const r = items.find(function (x) { return x.id === id; });
    if (!r) return;
    document.getElementById('f-id').value = r.id;
    document.getElementById('f-categoria').value = r['Categoría PESTEL'] || '';
    document.getElementById('f-factor').value = r['Factor'] || '';
    document.getElementById('f-descripcion').value = r['Descripción del factor'] || '';
    document.getElementById('f-plazo').value = r['Plazo'] || '';
    document.getElementById('f-impacto-tipo').value = r['Impacto'] || '';
    document.getElementById('f-ambito').value = r['Ámbito'] || '';
    document.getElementById('f-obra').value = r['Obra'] || '';
    document.getElementById('f-prob').value = r['Probabilidad'] || '';
    document.getElementById('f-consecuencia').value = r['Consecuencia'] || '';
    document.getElementById('f-monitorear').checked = r['Monitorear en Panel de Control'] === 'Sí';
    document.getElementById('f-responsables').value = r['Responsables de ejecución'] || '';
    formTitle.textContent = 'Editando factor PESTEL';
    btnCancelar.style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  btnCancelar.addEventListener('click', function () {
    form.reset();
    document.getElementById('f-id').value = '';
    formTitle.textContent = 'Nuevo factor PESTEL';
    btnCancelar.style.display = 'none';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const responsables = document.getElementById('f-responsables').value;
    if (responsables.split(',').filter(function (n) { return n.trim(); }).length < 2) {
      setStatus('Debes indicar al menos 2 responsables, separados por coma.', 'err');
      return;
    }
    const id = document.getElementById('f-id').value;
    const p = document.getElementById('f-prob').value;
    const c = document.getElementById('f-consecuencia').value;
    const registro = {
      'Categoría PESTEL': document.getElementById('f-categoria').value,
      'Factor': document.getElementById('f-factor').value,
      'Descripción del factor': document.getElementById('f-descripcion').value,
      'Plazo': document.getElementById('f-plazo').value,
      'Impacto': document.getElementById('f-impacto-tipo').value,
      'Ámbito': document.getElementById('f-ambito').value,
      'Obra': document.getElementById('f-obra').value,
      'Probabilidad': p,
      'Consecuencia': c,
      'Criticidad (P x C)': (p && c) ? (Number(p) * Number(c)) : '',
      'Responsables de ejecución': responsables,
      'Monitorear en Panel de Control': document.getElementById('f-monitorear').checked ? 'Sí' : 'No'
    };
    if (id) registro.id = id;

    setStatus('Guardando...', '');
    fetch(APP_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ tabla: TABLA, accion: id ? 'actualizar' : 'crear', registro: registro, usuario: USUARIO, clave: APP_KEY })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) { setStatus('Error: ' + data.error, 'err'); return; }
        setStatus('Guardado correctamente.', 'ok');
        form.reset();
        document.getElementById('f-id').value = '';
        formTitle.textContent = 'Nuevo factor PESTEL';
        btnCancelar.style.display = 'none';
        listar();
      })
      .catch(function (err) { setStatus('Error de conexión: ' + err.message, 'err'); });
  });

  listar();
</script>

</body>
</html>
