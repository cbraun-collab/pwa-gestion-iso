<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Scorecard · Gestión Integrada ISO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#003B49; --teal-light:#0A5568; --orange:#CF4520;
    --cream:#F7F5F0; --ink:#12222A; --line:#DCE3E1; --card-bg:#FFFFFF; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:'Space Grotesk',sans-serif; -webkit-font-smoothing:antialiased;}
  .mono{font-family:'JetBrains Mono',monospace;}
  header{background:var(--teal); color:#fff; padding:20px 24px;}
  .header-inner{max-width:980px; margin:0 auto; display:flex; align-items:center; gap:14px;}
  .header-logo{height:26px; width:auto;}
  .back{color:#fff; opacity:.8; text-decoration:none; font-size:13px;}
  .back:hover{opacity:1;}
  h1{margin:0; font-size:18px; font-weight:600;}
  .code-pill{font-family:'JetBrains Mono',monospace; font-size:10.5px; background:rgba(255,255,255,.12); padding:3px 9px; border-radius:999px; margin-left:auto;}
  main{max-width:980px; margin:0 auto; padding:28px 24px 64px;}
  .panel{background:var(--card-bg); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:22px;}
  .panel h2{margin:0 0 4px; font-size:16px; font-weight:600;}
  .panel .sub{margin:0 0 18px; font-size:12.5px; color:#6B7A7E;}
  .subhead{font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--teal-light); margin:20px 0 4px;}
  label{display:block; font-size:12.5px; font-weight:500; color:#3F4E52; margin-bottom:5px; margin-top:14px;}
  label:first-of-type{margin-top:0;}
  input[type=text], textarea, select{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    font-family:'Space Grotesk',sans-serif; font-size:14px; color:var(--ink); background:#FCFCFB;
  }
  textarea{resize:vertical; min-height:52px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--teal-light); outline-offset:1px; border-color:var(--teal-light);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:640px){.row2,.row3{grid-template-columns:1fr;}}
  .actions{display:flex; align-items:center; gap:12px; margin-top:18px;}
  button{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; padding:10px 18px; border-radius:8px; border:none; cursor:pointer;}
  .btn-primary{background:var(--orange); color:#fff;}
  .btn-primary:hover{background:#B93B1A;}
  .btn-secondary{background:transparent; color:var(--teal-light); border:1px solid var(--line);}
  .status{font-size:12.5px; color:#6B7A7E;}
  .status.ok{color:#2C6E45;}
  .status.err{color:#B93B1A;}

  .ambito-group{margin-bottom:18px;}
  .ambito-title{font-size:13px; font-weight:600; color:var(--teal); margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .ambito-title .count{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#8A9A9E; font-weight:400;}
  .obj-card{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; background:#FCFCFB; cursor:pointer;}
  .obj-card:hover{border-color:var(--teal-light);}
  .obj-card .obj-title{font-weight:600; font-size:13.5px; margin-bottom:4px;}
  .obj-card .obj-meta{font-size:11.5px; color:#8A9A9E; font-family:'JetBrains Mono',monospace;}
  .obj-card .obj-indicador{font-size:12.5px; color:#4B5D63; margin-top:6px;}
  .empty{padding:20px; text-align:center; color:#8A9A9E; font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="logo-senercom.png" alt="Senercom" class="header-logo">
    <a class="back" href="index.html">&larr; Inicio</a>
    <h1>Balance Scorecard</h1>
    <span class="code-pill mono">DOC-SGC-006</span>
  </div>
</header>

<main>

  <div class="panel">
    <h2 id="form-title">Nuevo objetivo</h2>
    <p class="sub">Mismos campos del documento — objetivo, meta por año y plan de acción.</p>

    <form id="form-bsc">
      <input type="hidden" id="f-id" value="">

      <div class="subhead">Objetivo</div>
      <div class="row2">
        <div>
          <label for="f-ambito">Ámbito</label>
          <select id="f-ambito" required>
            <option value="">Selecciona...</option>
            <option value="Financiero">Financiero</option>
            <option value="Personas">Personas</option>
            <option value="Procesos">Procesos</option>
            <option value="Sociedad y Ambiente">Sociedad y Ambiente</option>
            <option value="Clientes">Clientes</option>
          </select>
        </div>
        <div>
          <label for="f-anio">Año</label>
          <input type="text" id="f-anio" placeholder="Ej: 2026" required>
        </div>
      </div>

      <label for="f-objetivo">Objetivo general</label>
      <textarea id="f-objetivo" required></textarea>

      <div class="row2">
        <div>
          <label for="f-meta">Meta</label>
          <input type="text" id="f-meta" placeholder="Ej: 90% o más">
        </div>
        <div>
          <label for="f-frecuencia">Frecuencia de control</label>
          <select id="f-frecuencia">
            <option value="">-</option>
            <option>Semanal</option><option>Mensual</option><option>Trimestral</option><option>Semestral</option><option>Anual</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="f-indicador">Indicador y medición</label>
          <input type="text" id="f-indicador">
        </div>
        <div>
          <label for="f-responsable-obj">Responsable del objetivo</label>
          <input type="text" id="f-responsable-obj">
        </div>
      </div>

      <div class="subhead">Plan de acción</div>
      <label for="f-actividad">Actividad</label>
      <textarea id="f-actividad"></textarea>

      <div class="row3">
        <div>
          <label for="f-responsable-act">Responsable actividad</label>
          <input type="text" id="f-responsable-act">
        </div>
        <div>
          <label for="f-recursos">Recursos</label>
          <input type="text" id="f-recursos">
        </div>
        <div>
          <label for="f-plazo">Plazo</label>
          <input type="text" id="f-plazo">
        </div>
      </div>

      <label for="f-seguimiento">Seguimiento / Observaciones</label>
      <textarea id="f-seguimiento"></textarea>

      <label style="display:flex; align-items:center; gap:8px; margin-top:16px;">
        <input type="checkbox" id="f-monitorear" style="width:auto;">
        Monitorear en Panel de Control
      </label>

      <label for="f-responsables">Responsables de ejecución (mínimo 2 personas, separadas por coma)</label>
      <input type="text" id="f-responsables" placeholder="Ej: Carlos Braun, Cristián Menéndez" required>

      <div class="actions">
        <button type="submit" class="btn-primary">Guardar</button>
        <button type="button" class="btn-secondary" id="btn-cancelar" style="display:none;">Cancelar edición</button>
        <span class="status" id="status"></span>
      </div>
    </form>
  </div>

  <div class="panel">
    <h2>Objetivos por ámbito</h2>
    <p class="sub">Todo lo cargado, agrupado igual que el documento.</p>
    <div id="lista-ambitos"></div>
  </div>

</main>

<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzCquDf6sVRaGePNemoq1CMlZN9wdivpRmCw7omiSkgHiIcWIcf8jhC5t9Lc01UhMt7hw/exec';
  const APP_KEY = 'senercom-sgi-7x9K2m';
  const TABLA = 'Balance_Scorecard';
  const USUARIO = 'Carlos Braun';
  const AMBITOS = ['Financiero', 'Personas', 'Procesos', 'Sociedad y Ambiente', 'Clientes'];
  let items = [];

  const form = document.getElementById('form-bsc');
  const statusEl = document.getElementById('status');
  const btnCancelar = document.getElementById('btn-cancelar');
  const formTitle = document.getElementById('form-title');

  function setStatus(msg, tipo) { statusEl.textContent = msg; statusEl.className = 'status' + (tipo ? ' ' + tipo : ''); }
  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function formatearFecha(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function listar() {
    const callbackName = 'cb_' + Date.now();
    window[callbackName] = function (data) {
      items = data.registros || [];
      renderLista();
      delete window[callbackName];
      document.body.removeChild(script);
    };
    const script = document.createElement('script');
    script.src = APP_URL + '?accion=listar&tabla=' + TABLA + '&clave=' + APP_KEY + '&callback=' + callbackName;
    document.body.appendChild(script);
  }

  function renderLista() {
    const cont = document.getElementById('lista-ambitos');
    let html = '';
    AMBITOS.forEach(function (amb) {
      const propios = items.filter(function (x) { return x['Ámbito'] === amb; });
      html += '<div class="ambito-group"><div class="ambito-title">' + amb + ' <span class="count">(' + propios.length + ')</span></div>';
      if (!propios.length) {
        html += '<div class="empty">Sin objetivos aún.</div>';
      } else {
        propios.forEach(function (r) {
          const fechaEdicion = r['modificado_fecha'] || r['creado_fecha'] || '';
          html += '<div class="obj-card" onclick="editar(\'' + r.id + '\')">' +
            '<div class="obj-title">' + escapeHtml(r['Objetivo general']) + '</div>' +
            '<div class="obj-meta">' + (r['Año'] || '') + ' · Meta: ' + escapeHtml(r['Meta']) + ' · ' + (r['Frecuencia de control'] || '') + '</div>' +
            (r['Indicador y medición'] ? '<div class="obj-indicador">Indicador: ' + escapeHtml(r['Indicador y medición']) + '</div>' : '') +
            (r['Responsables de ejecución'] ? '<div class="obj-meta">Responsables: ' + escapeHtml(r['Responsables de ejecución']) + '</div>' : '') +
            (fechaEdicion ? '<div class="obj-meta">Editado: ' + formatearFecha(fechaEdicion) + '</div>' : '') +
            '</div>';
        });
      }
      html += '</div>';
    });
    cont.innerHTML = html;
  }

  window.editar = function (id) {
    const r = items.find(function (x) { return x.id === id; });
    if (!r) return;
    document.getElementById('f-id').value = r.id;
    document.getElementById('f-ambito').value = r['Ámbito'] || '';
    document.getElementById('f-anio').value = r['Año'] || '';
    document.getElementById('f-objetivo').value = r['Objetivo general'] || '';
    document.getElementById('f-meta').value = r['Meta'] || '';
    document.getElementById('f-frecuencia').value = r['Frecuencia de control'] || '';
    document.getElementById('f-indicador').value = r['Indicador y medición'] || '';
    document.getElementById('f-responsable-obj').value = r['Responsable objetivo'] || '';
    document.getElementById('f-actividad').value = r['Actividad'] || '';
    document.getElementById('f-responsable-act').value = r['Responsable actividad'] || '';
    document.getElementById('f-recursos').value = r['Recursos'] || '';
    document.getElementById('f-plazo').value = r['Plazo'] || '';
    document.getElementById('f-seguimiento').value = r['Seguimiento / Observaciones'] || '';
    document.getElementById('f-monitorear').checked = r['Monitorear en Panel de Control'] === 'Sí';
    document.getElementById('f-responsables').value = r['Responsables de ejecución'] || '';
    formTitle.textContent = 'Editando objetivo';
    btnCancelar.style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  btnCancelar.addEventListener('click', function () {
    form.reset();
    document.getElementById('f-id').value = '';
    formTitle.textContent = 'Nuevo objetivo';
    btnCancelar.style.display = 'none';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const responsables = document.getElementById('f-responsables').value;
    if (responsables.split(',').filter(function (n) { return n.trim(); }).length < 2) {
      setStatus('Debes indicar al menos 2 responsables, separados por coma.', 'err');
      return;
    }
    const id = document.getElementById('f-id').value;
    const registro = {
      'Ámbito': document.getElementById('f-ambito').value,
      'Año': document.getElementById('f-anio').value,
      'Objetivo general': document.getElementById('f-objetivo').value,
      'Meta': document.getElementById('f-meta').value,
      'Frecuencia de control': document.getElementById('f-frecuencia').value,
      'Indicador y medición': document.getElementById('f-indicador').value,
      'Responsable objetivo': document.getElementById('f-responsable-obj').value,
      'Actividad': document.getElementById('f-actividad').value,
      'Responsable actividad': document.getElementById('f-responsable-act').value,
      'Recursos': document.getElementById('f-recursos').value,
      'Plazo': document.getElementById('f-plazo').value,
      'Seguimiento / Observaciones': document.getElementById('f-seguimiento').value,
      'Responsables de ejecución': responsables,
      'Monitorear en Panel de Control': document.getElementById('f-monitorear').checked ? 'Sí' : 'No'
    };
    if (id) registro.id = id;

    setStatus('Guardando...', '');
    fetch(APP_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ tabla: TABLA, accion: id ? 'actualizar' : 'crear', registro: registro, usuario: USUARIO, clave: APP_KEY })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) { setStatus('Error: ' + data.error, 'err'); return; }
        setStatus('Guardado correctamente.', 'ok');
        form.reset();
        document.getElementById('f-id').value = '';
        formTitle.textContent = 'Nuevo objetivo';
        btnCancelar.style.display = 'none';
        listar();
      })
      .catch(function (err) { setStatus('Error de conexión: ' + err.message, 'err'); });
  });

  listar();
</script>

</body>
</html>
